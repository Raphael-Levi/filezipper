services:
  filebrowser:
    image: gtstef/filebrowser:beta
    container_name: filezipper-filebrowser
    restart: unless-stopped
    # On Linux, set FILEBROWSER_UID/GID in .env to the owner of the two
    # mounted directories so the browser can create and move files.
    user: "${FILEBROWSER_UID:-1000}:${FILEBROWSER_GID:-1000}"
    ports:
      - "${FILEBROWSER_PORT:-8080}:80"
    volumes:
      - ./filezipper:/archives
      - ./filebrowser/data:/home/filebrowser/data
      - ./filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro
